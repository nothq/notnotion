[workspace]
resolver = "2"
members = [
    "crates/app/model",
    "crates/gpui-components",
    "crates/local_cache",
    "crates/notion",
    "crates/notnotion",
    "crates/remote-image",
    "crates/remote-image/model",
    "crates/secret_store",
    "crates/zed-syntax",
]
default-members = ["crates/notnotion"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
emojis = "0.8"
fs2 = "0.4"
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "552fc9f3c3c775276c2ce3f0fb93f1f4c2c18ba6" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "552fc9f3c3c775276c2ce3f0fb93f1f4c2c18ba6", features = ["font-kit", "x11"] }
image = "0.25.10"
mermaid-rs-renderer = { git = "https://github.com/zed-industries/mermaid-rs-renderer", rev = "374db9ead5426697c6c2111151d9f246899bc638", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "json", "multipart", "rustls-tls", "stream", "zstd"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.23"
theme = { git = "https://github.com/zed-industries/zed", rev = "552fc9f3c3c775276c2ce3f0fb93f1f4c2c18ba6" }
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tree-sitter = "0.26.9"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "5cb9b693cfd7bfacab1d9ff4acac1a4150700609" }
tree-sitter-css = "0.23"
tree-sitter-diff = "0.1.0"
tree-sitter-go = "0.25"
tree-sitter-highlight = "=0.26.10"
tree-sitter-json = "0.24"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = { git = "https://github.com/zed-industries/tree-sitter-typescript", rev = "e2c53597d6a5d9cf7bbe8dccde576fe1e46c5899" }
tree-sitter-yaml = { git = "https://github.com/zed-industries/tree-sitter-yaml", rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a" }
url = "2"
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }

# GPUI's dependency pins, matching the Zed revision above.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
block = { git = "https://github.com/TeamCadenceAI/rust-block", rev = "127f664ab583a20b099d163601d0698ae256c7ac" }
calloop = { git = "https://github.com/zed-industries/calloop" }
naga = { git = "https://github.com/zed-industries/wgpu.git", branch = "v29" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }

[workspace.lints.clippy]
cognitive_complexity = "deny"
dbg_macro = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
